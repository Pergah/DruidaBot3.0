<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRUIDA PLANT</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: #050508;
  color: #fff;
  font-family: 'Courier New', Courier, monospace;
  overflow: hidden;
}

@keyframes plantBob  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
@keyframes pulse     { 0%,100%{opacity:.4} 50%{opacity:1} }
@keyframes flicker   { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:.85} 95%{opacity:1} 97%{opacity:.9} }
@keyframes xpGain    { 0%{opacity:0;transform:translate(-50%,0)} 30%{opacity:1} 100%{opacity:0;transform:translate(-50%,-28px)} }
@keyframes levelUp   { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }

/* ── WRAPPER ── */
.wrapper {
  max-width: 600px;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ── TOPBAR ── */
.topbar {
  height: clamp(40px, 7vw, 56px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(14px, 3.5vw, 22px);
  background: rgba(5,2,22,0.97);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
  position: relative;
  z-index: 100;
}
.logo { font-size: clamp(13px, 3.2vw, 19px); font-weight: 800; letter-spacing: 2px; transition: color .4s, text-shadow .4s; }
.logo span { color: rgba(255,255,255,.3); }
.live { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #22c55e; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; animation: pulse 2s ease-in-out infinite; }

/* ── GAME SCENE ── */
.game-scene {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  min-height: 0;
}

/* Scanline overlay */
.game-scene::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0, transparent 3px,
    rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px
  );
  pointer-events: none;
  z-index: 80;
  animation: flicker 8s linear infinite;
}

/* ─────────────────────────────────────────────
   GROW ROOM BACKGROUND
   Reemplazar con: background-image: url(assets/bg/growroom.jpg)
   ───────────────────────────────────────────── */
.room-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, #070710 0%, #090912 60%, #0c0c16 100%);
  /* future: background-image: url(assets/bg/growroom.jpg); background-size: cover; */
}
/* Pared - textura sutil de concreto */
.room-wall {
  position: absolute;
  inset: 0;
  bottom: 26%;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.013) 0, rgba(255,255,255,0.013) 1px, transparent 1px, transparent 55px),
    repeating-linear-gradient(0deg,  rgba(255,255,255,0.013) 0, rgba(255,255,255,0.013) 1px, transparent 1px, transparent 55px);
}
/* Piso - baldosas */
.room-floor {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 26%;
  background: linear-gradient(180deg, #0d0d18 0%, #0f0f1c 100%);
  border-top: 1px solid rgba(255,255,255,0.05);
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 40px),
    repeating-linear-gradient(0deg,  rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 40px);
}

/* ─────────────────────────────────────────────
   CARPA INDOOR (GROW TENT)
   Interior de mylar plateado reflectivo
   ───────────────────────────────────────────── */
.grow-tent {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: clamp(165px, 44vw, 290px);
  bottom: clamp(115px, 20vw, 160px);
  width: clamp(160px, 43vw, 290px);
  /* Interior mylar: plateado oscuro con reflejos */
  background: linear-gradient(160deg,
    #2a2a38 0%, #1e1e2c 15%, #262636 30%,
    #1c1c2a 50%, #222232 65%, #1a1a28 80%,
    #202030 100%
  );
  border: 4px solid #10101a;
  box-shadow:
    inset 2px 0 30px rgba(255,255,255,0.04),
    inset -2px 0 30px rgba(255,255,255,0.04),
    inset 0 20px 60px rgba(255,230,120,0.06),
    0 0 50px rgba(0,0,0,0.95),
    -8px 0 30px rgba(0,0,0,0.8),
    8px 0 30px rgba(0,0,0,0.8);
  z-index: 4;
  overflow: hidden;
}
/* Frame de aluminio */
.grow-tent::before {
  content: '';
  position: absolute;
  inset: 0;
  border: 10px solid #0e0e18;
  pointer-events: none;
  z-index: 2;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
}
/* Costura/zip central */
.grow-tent::after {
  content: '';
  position: absolute;
  top: 10px; bottom: 10px;
  left: 50%;
  width: 1px;
  background: linear-gradient(180deg,
    transparent 0%, rgba(0,0,0,0.25) 15%,
    rgba(0,0,0,0.25) 85%, transparent 100%
  );
  pointer-events: none;
  z-index: 3;
}

/* Barra de luces LED (top interior carpa) */
.tent-lights {
  position: absolute;
  left: 10px; right: 10px; top: 10px;
  height: 18px;
  background: linear-gradient(180deg, #1a1a28 0%, #222235 100%);
  border: 1px solid #2a2a40;
  border-bottom: 2px solid #333350;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  padding: 0 6px;
}
.tent-lights::after {
  content: '';
  position: absolute;
  bottom: -50px; left: 0; right: 0;
  height: 50px;
  background: radial-gradient(ellipse 80% 50px at 50% 0%,
    rgba(255,235,120,0.18) 0%, transparent 100%
  );
  pointer-events: none;
}
.led { display:inline-block; width:5px; height:5px; border-radius:50%; }
.led-r { background:#ff1a50; box-shadow:0 0 4px #ff1a50; }
.led-b { background:#1a50ff; box-shadow:0 0 4px #1a50ff; }
.led-w { background:#ffffd0; box-shadow:0 0 5px #ffffd0; }

/* ─────────────────────────────────────────────
   DISPOSITIVOS DE CULTIVO
   Iconos pixel-art de equipamiento
   Reemplazar cada .device-icon con:
   <img src="assets/equipment/nombre.svg" width="32" height="32">
   ───────────────────────────────────────────── */
.device {
  position: absolute;
  z-index: 15;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.device-icon {
  width: 34px; height: 34px;
  background: #0c0c18;
  border: 1px solid rgba(255,255,255,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  /* future: overflow:hidden para mostrar <img> */
}
.device-label {
  font-size: 6px;
  font-weight: 700;
  letter-spacing: 0.4px;
  color: rgba(255,255,255,0.45);
  text-align: center;
  white-space: nowrap;
}
/* Indicador de estado LED */
.dev-led {
  width: 5px; height: 5px;
  border-radius: 50%;
  position: absolute;
  top: 3px; right: 3px;
}
.s-on   { background:#22c55e; box-shadow:0 0 4px #22c55e; }
.s-off  { background:#2a2a2a; }
.s-warn { background:#f97316; box-shadow:0 0 5px #f97316; animation:pulse 1.4s infinite; }

/* Posiciones de pared — ya no se usan (equipos movidos a spell-bar) */

/* ─────────────────────────────────────────────
   SPELL BAR — barra de equipos estilo relay-btn-grid del dashboard
   Inspirado en: components/DashboardSensorCard relay-btn-grid
   ───────────────────────────────────────────── */
.spell-bar {
  position: absolute;
  bottom: 43px; left: 0; right: 0;  /* justo encima del switcher (43px) */
  z-index: 50;
  background: rgba(4,1,18,0.97);
  border-top: 1px solid rgba(255,255,255,0.1);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  padding: 5px 6px 4px;
}
.spell-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
}
.spell-btn {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 4px;
  padding: 5px 3px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  position: relative;
  cursor: default;
  transition: background .25s, border-color .25s;
  font-family: 'Courier New', monospace;
}
.spell-btn.is-on {
  background: rgba(34,197,94,0.07);
  border-color: rgba(34,197,94,0.3);
}
.spell-btn.is-warn {
  background: rgba(249,115,22,0.09);
  border-color: rgba(249,115,22,0.4);
  animation: warnPulse 1.2s ease-in-out infinite;
}
.spell-btn.is-off {
  background: rgba(255,255,255,0.02);
  border-color: rgba(255,255,255,0.06);
  opacity: 0.55;
}
@keyframes warnPulse {
  0%,100% { border-color: rgba(249,115,22,0.25); }
  50%     { border-color: rgba(249,115,22,0.65); box-shadow: 0 0 6px rgba(249,115,22,0.25); }
}
.spell-dot {
  width: 5px; height: 5px; border-radius: 50%;
  position: absolute; top: 3px; right: 4px;
}
.s-on   { background:#22c55e; box-shadow:0 0 4px #22c55e; }
.s-off  { background:#2a2a2a; }
.s-warn { background:#f97316; box-shadow:0 0 5px #f97316; animation:pulse 1.4s infinite; }
.spell-icon { font-size:clamp(15px,4vw,24px); line-height:1.1; }
.spell-name {
  font-size: clamp(6px,1.6vw,10px); font-weight: 700; letter-spacing: .4px;
  color: rgba(255,255,255,0.45); text-align: center;
  text-transform: uppercase; white-space: nowrap;
}

/* ── HUD PANEL — stats unificados estilo MMORPG ── */
.hud-panel {
  position: absolute;
  top: clamp(6px, 1.2vw, 10px); left: clamp(6px, 1.2vw, 10px);
  z-index: 40;
  background: rgba(4,1,18,0.94);
  border: 2px solid #4ade80;
  box-shadow: inset 0 0 14px rgba(74,222,128,0.07), 0 0 18px rgba(74,222,128,0.32);
  padding: clamp(10px, 2.5vw, 18px) clamp(12px, 3vw, 20px);
  min-width: clamp(185px, 47vw, 310px);
  max-width: clamp(200px, 52vw, 340px);
  font-family: 'Courier New', monospace;
  font-size: clamp(10px, 2.5vw, 14px); font-weight: 700;
  letter-spacing: 0.7px; text-transform: uppercase;
  transition: border-color .4s, box-shadow .4s;
}
/* — fila superior: retrato + nombre + nivel — */
.hp-header { display:flex; align-items:center; gap:clamp(8px,2vw,14px); margin-bottom:clamp(7px,1.8vw,12px); }
.hp-portrait { font-size:clamp(28px,7.5vw,48px); line-height:1; flex-shrink:0; }
.hp-meta { display:flex; flex-direction:column; gap:3px; }
.hp-title { font-size:clamp(8px,2.1vw,13px); letter-spacing:2px; color:rgba(255,255,255,0.45); white-space:nowrap; }
.hp-lvl-hearts { display:flex; align-items:baseline; gap:clamp(6px,1.5vw,10px); }
.hp-level { font-size:clamp(20px,5.3vw,34px); font-weight:800; color:#fff; line-height:1; }
.hp-hearts { font-size:clamp(12px,3.2vw,20px); letter-spacing:.5px; transition:color .4s, text-shadow .4s; }
/* — barras HP / XP — */
.hp-bar-row { display:flex; align-items:center; gap:5px; margin:clamp(3px,0.8vw,5px) 0; }
.hp-bar-lbl { font-size:clamp(8px,2vw,12px); width:clamp(14px,3.5vw,20px); flex-shrink:0; color:rgba(255,255,255,0.4); }
.hp-bar-track { flex:1; height:clamp(6px,1.5vw,9px); background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); }
.hp-bar-fill  { height:100%; transition:width .6s ease, background .4s; }
.hp-bar-pct   { font-size:clamp(8px,2vw,12px); width:clamp(26px,6vw,38px); text-align:right; flex-shrink:0; color:rgba(255,255,255,0.45); }
/* — grilla de entorno: TEMP / HUM / VPD / SUELO — */
.hp-env-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: clamp(5px,1.3vw,9px) clamp(12px,3vw,20px);
  margin-top: clamp(9px,2.2vw,14px); padding-top: clamp(8px,2vw,12px);
  border-top: 1px solid rgba(255,255,255,0.08);
}
.hp-env-cell { display:flex; flex-direction:column; gap:2px; }
.hp-env-lbl  { font-size:clamp(8px,2vw,12px); color:rgba(255,255,255,0.3); letter-spacing:.5px; }
.hp-env-val  { font-size:clamp(14px,3.7vw,24px); font-weight:800; transition:color .4s; }

/* ── PLANT STAGE ── */
.plant-stage {
  position: relative;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 134px;
  gap: 2px;
}
.plant-wrap {
  animation: plantBob 2.8s ease-in-out infinite;
  display: inline-block;
  transition: filter .4s;
}
.state-label {
  font-size:clamp(8px,2.2vw,13px); font-weight:800; letter-spacing:2px;
  text-transform:uppercase; text-align:center;
  transition:color .4s, text-shadow .4s;
}
.cycle-badge {
  font-size:clamp(8px,2.1vw,13px); font-weight:700; border-radius:3px;
  padding:2px 7px; letter-spacing:1px; white-space:nowrap;
}
/* Etapa de evolución */
.evo-badge {
  font-size:clamp(7px,1.9vw,12px); font-weight:800; letter-spacing:1.5px;
  padding:2px 8px; border-radius:2px; white-space:nowrap;
  transition: color .3s;
}
.evo-flash { animation: levelUp .5s ease-out; }
/* XP float */
.xp-float {
  position:absolute; bottom:260px; left:50%;
  transform:translateX(-50%);
  font-size:9px; font-weight:800;
  color:#a855f7; text-shadow:0 0 6px #a855f7;
  pointer-events:none; opacity:0; z-index:90; white-space:nowrap;
}
.xp-float.pop { animation: xpGain 1.4s ease-out forwards; }

/* ── SWITCHER (test preview only — no se usa en producción) ── */
.switcher {
  position:absolute; bottom:0; left:0; right:0;
  display:flex; gap:2px; flex-wrap:wrap;
  justify-content:center; z-index:50;
  padding:2px 6px;
  background:rgba(4,1,18,0.99);
  border-top:1px solid rgba(255,255,255,0.04);
}
.sw-btn {
  font-size:clamp(7px,1.8vw,11px); font-weight:700; font-family:'Courier New',monospace;
  letter-spacing:.4px; padding:3px 7px; border-radius:2px;
  cursor:pointer; transition:all .2s; white-space:nowrap; background:transparent;
}
</style>
</head>
<body>
<div class="wrapper">

  <div class="topbar">
    <div class="logo" id="logo">DRUIDA <span>BOT</span></div>
    <div class="live"><div class="live-dot"></div>LIVE</div>
  </div>

  <div class="game-scene">

    <!-- ROOM BACKGROUND — future: <img src="assets/bg/growroom.jpg"> -->
    <div class="room-bg"></div>
    <div class="room-wall"></div>
    <div class="room-floor"></div>

    <!-- CARPA INDOOR (grow tent) — fondo de mylar plateado -->
    <div class="grow-tent">
      <!-- Barra de luces LED -->
      <div class="tent-lights">
        <span class="led led-r"></span><span class="led led-b"></span>
        <span class="led led-w"></span><span class="led led-w"></span>
        <span class="led led-r"></span><span class="led led-b"></span>
        <span class="led led-w"></span><span class="led led-w"></span>
        <span class="led led-r"></span><span class="led led-b"></span>
        <span class="led led-w"></span><span class="led led-r"></span>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════
         SPELL BAR — equipos estilo relay-btn-grid del dashboard
         Reemplazar emoji por <img src="assets/equipment/X.svg"> cuando estén listos
         ═══════════════════════════════════════════════ -->
    <div class="spell-bar">
      <div class="spell-grid">
        <div class="spell-btn is-on"  data-dev="lights">
          <span class="spell-dot s-on"></span>
          <span class="spell-icon">💡</span>
          <span class="spell-name">LUCES</span>
        </div>
        <div class="spell-btn is-on"  data-dev="ac">
          <span class="spell-dot s-on"></span>
          <span class="spell-icon">❄️</span>
          <span class="spell-name">A/C</span>
        </div>
        <div class="spell-btn is-off" data-dev="humidif">
          <span class="spell-dot s-off"></span>
          <span class="spell-icon">💦</span>
          <span class="spell-name">HUMID.</span>
        </div>
        <div class="spell-btn is-on"  data-dev="dehumidif">
          <span class="spell-dot s-on"></span>
          <span class="spell-icon">💧</span>
          <span class="spell-name">DEHUM.</span>
        </div>
        <div class="spell-btn is-off" data-dev="calef">
          <span class="spell-dot s-off"></span>
          <span class="spell-icon">🔥</span>
          <span class="spell-name">CALEF.</span>
        </div>
        <div class="spell-btn is-on"  data-dev="extract">
          <span class="spell-dot s-on"></span>
          <span class="spell-icon">⬆️</span>
          <span class="spell-name">EXTRAC.</span>
        </div>
        <div class="spell-btn is-on"  data-dev="intrac">
          <span class="spell-dot s-on"></span>
          <span class="spell-icon">⬇️</span>
          <span class="spell-name">INTRAC.</span>
        </div>
        <div class="spell-btn is-off" data-dev="riego">
          <span class="spell-dot s-off"></span>
          <span class="spell-icon">🚿</span>
          <span class="spell-name">RIEGO</span>
        </div>
      </div>
    </div>

    <!-- ═══ HUD PANEL — stats unificados estilo MMORPG ═══ -->
    <div class="hud-panel" id="hud-panel">

      <!-- Retrato + nombre + nivel + corazones -->
      <div class="hp-header">
        <span class="hp-portrait" id="hud-portrait">🌱</span>
        <div class="hp-meta">
          <div class="hp-title">CANNABIS PLANT</div>
          <div class="hp-lvl-hearts">
            <span style="font-size:8px;color:rgba(255,255,255,.4)">LVL</span>
            <span id="hud-level" class="hp-level">5</span>
            <span class="hp-hearts" id="hearts-display">♥♥♥♥♡</span>
          </div>
        </div>
      </div>

      <!-- Barra HP -->
      <div class="hp-bar-row">
        <span class="hp-bar-lbl">HP</span>
        <div class="hp-bar-track">
          <div class="hp-bar-fill" id="hp-bar" style="width:80%;background:#4ade80;box-shadow:0 0 5px #4ade80"></div>
        </div>
        <span class="hp-bar-pct" id="hp-pct">80%</span>
      </div>

      <!-- Barra XP -->
      <div class="hp-bar-row">
        <span class="hp-bar-lbl" style="color:#a855f7">XP</span>
        <div class="hp-bar-track">
          <div class="hp-bar-fill" id="xp-bar" style="width:48%;background:#a855f7;box-shadow:0 0 5px #a855f7"></div>
        </div>
        <span class="hp-bar-pct" id="xp-pct">48%</span>
      </div>

      <!-- Grilla entorno: TEMP / HUM / VPD / SUELO -->
      <div class="hp-env-grid">
        <div class="hp-env-cell">
          <div class="hp-env-lbl">TEMP</div>
          <div class="hp-env-val" id="stat-temp">26°C</div>
        </div>
        <div class="hp-env-cell">
          <div class="hp-env-lbl">HUM</div>
          <div class="hp-env-val" id="stat-hum">55%</div>
        </div>
        <div class="hp-env-cell">
          <div class="hp-env-lbl">VPD</div>
          <div class="hp-env-val" id="stat-vpd">1.10</div>
        </div>
        <div class="hp-env-cell">
          <div class="hp-env-lbl">SUELO</div>
          <div class="hp-env-val" id="stat-soil">58%</div>
        </div>
      </div>

    </div>

    <!-- PLANTA (centrada en la carpa) -->
    <div class="plant-stage">
      <div class="state-label" id="state-label">SALUDABLE</div>
      <div class="cycle-badge" id="cycle-badge" style="display:none"></div>
      <div class="evo-badge" id="evo-badge">🌱 SEMILLA</div>
      <div class="plant-wrap" id="plant-wrap">
        <svg id="plant-svg" width="120" height="192" viewBox="0 0 120 192"
             style="display:block;image-rendering:pixelated"></svg>
      </div>
    </div>

    <!-- XP float -->
    <div class="xp-float" id="xp-float">+XP</div>

    <!-- SWITCHER -->
    <div class="switcher" id="switcher"></div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// STATES — datos mock para preview (reemplazar con datos reales)

function getEvoStage(level) {
  return EVOLUTION_STAGES.find(s => level >= s.minLvl && level <= s.maxLvl) || EVOLUTION_STAGES[0]
}

// ═══════════════════════════════════════════════════════════════
// SISTEMA DE XP / NIVELES
// ─────────────────────────────────────────────────────────────
// Reglas de puntos:
//   +XP  por minuto conectado y transmitiendo datos
//   -XP  si se corta la conexión (penalización por minuto offline)
//   -XP  si VPD < 5 hPa (0.5 kPa) o VPD > 15 hPa (1.5 kPa)
//
// Al integrar datos reales:
//   - GAME_STATE.level y .xp vienen de la DB / perfil del dispositivo
//   - connected=true cuando hay heartbeat MQTT activo
//   - simulateXpTick() se reemplaza por cálculo en backend/cron
// ═══════════════════════════════════════════════════════════════
const XP_CONFIG = {
  gainConnected:    2,    // XP por minuto conectado y transmitiendo
  penaltyOffline:  -3,    // XP por minuto sin conexión
  penaltyVpd:      -2,    // XP adicional por minuto con VPD fuera de rango
  xpPerLevel:       100,  // XP para subir de nivel (puede escalar: 100 * level)
}

// VPD ideal: 5–15 hPa (= 0.5–1.5 kPa)
const VPD_RANGE = { minKpa: 0.5, maxKpa: 1.5 }

let GAME_STATE = {
  level:         5,
  xp:            48,
  xpNeeded:      100,
  uptimeMinutes: 240,
  stateKey:      'healthy',
  connected:     true,  // true = bot online y transmitiendo
}

function calcXpGain() {
  if (!GAME_STATE.connected) return XP_CONFIG.penaltyOffline

  const vpd    = parseFloat(STATES[GAME_STATE.stateKey].vpd)
  const vpdOk  = vpd >= VPD_RANGE.minKpa && vpd <= VPD_RANGE.maxKpa
  let gain     = XP_CONFIG.gainConnected
  if (!vpdOk)  gain += XP_CONFIG.penaltyVpd   // resta si VPD fuera de 5-15 hPa
  return gain
}

function simulateXpTick() {
  const gain   = calcXpGain()
  const prevEvo = getEvoStage(GAME_STATE.level)

  GAME_STATE.xp += gain
  GAME_STATE.uptimeMinutes++

  // XP no baja de 0
  if (GAME_STATE.xp < 0) GAME_STATE.xp = 0

  // Level up
  while (GAME_STATE.xp >= GAME_STATE.xpNeeded) {
    GAME_STATE.xp -= GAME_STATE.xpNeeded
    GAME_STATE.level++
    // Escalar dificultad: GAME_STATE.xpNeeded = 100 * GAME_STATE.level
  }

  const newEvo = getEvoStage(GAME_STATE.level)
  updateXpHud()

  // Float notif
  const f = document.getElementById('xp-float')
  f.textContent = gain >= 0 ? `+${gain} XP` : `${gain} XP ⚠`
  f.style.color  = gain >= 0 ? '#a855f7' : '#f97316'
  f.style.textShadow = gain >= 0 ? '0 0 6px #a855f7' : '0 0 6px #f97316'
  f.classList.remove('pop')
  void f.offsetWidth
  f.classList.add('pop')

  if (newEvo !== prevEvo) onEvolution(newEvo)
}

function onEvolution(evo) {
  const badge = document.getElementById('evo-badge')
  badge.classList.add('evo-flash')
  setTimeout(() => badge.classList.remove('evo-flash'), 600)
  renderPlant(GAME_STATE.stateKey)
}

function updateXpHud() {
  const pct     = Math.min(100, (GAME_STATE.xp / GAME_STATE.xpNeeded * 100)).toFixed(0)
  const evo     = getEvoStage(GAME_STATE.level)
  document.getElementById('hud-level').textContent   = GAME_STATE.level
  document.getElementById('xp-bar').style.width      = `${pct}%`
  const xpPct = document.getElementById('xp-pct')
  if (xpPct) xpPct.textContent = `${pct}%`
  // Retrato del panel = emoji de la etapa de evolución actual
  const portrait = document.getElementById('hud-portrait')
  if (portrait) portrait.textContent = evo.emoji
  const badge = document.getElementById('evo-badge')
  badge.textContent = `${evo.emoji} ${evo.name}`
}

// ═══════════════════════════════════════════════════════════════
// RENDER PLANT — lee el grid del stage de evolución actual
// ═══════════════════════════════════════════════════════════════
function renderPlant(stKey) {
  const evo  = getEvoStage(GAME_STATE.level)
  const grid = evo.grid
  const pal  = PALETTES[stKey]
  const PX   = 6
  const map  = { 1:pal.l1, 2:pal.l2, 3:pal.l3, 4:pal.stem, 5:pal.bud, 6:'#312e81', 7:'#1e1b4b' }
  const svg  = document.getElementById('plant-svg')
  const rows = grid.length, cols = grid[0].length
  svg.setAttribute('width',   cols * PX)
  svg.setAttribute('height',  rows * PX)
  svg.setAttribute('viewBox', `0 0 ${cols * PX} ${rows * PX}`)
  let h = ''
  grid.forEach((row, y) => row.forEach((cell, x) => {
    if (cell) h += `<rect x="${x*PX}" y="${y*PX}" width="${PX}" height="${PX}" fill="${map[cell]}"/>`
  }))
  svg.innerHTML = h
}

// ═══════════════════════════════════════════════════════════════
// APPLY STATE — actualiza toda la UI según el estado de salud
// ═══════════════════════════════════════════════════════════════
function apply(stKey) {
  GAME_STATE.stateKey = stKey
  const st = STATES[stKey]
  const c  = st.color

  document.getElementById('logo').style.cssText = `color:${c};text-shadow:0 0 10px ${c}88`

  renderPlant(stKey)
  document.getElementById('plant-wrap').style.filter = `drop-shadow(0 0 14px ${st.glow})`

  const sl = document.getElementById('state-label')
  sl.textContent = st.label; sl.style.color = c; sl.style.textShadow = `0 0 10px ${c}88`

  const badge = document.getElementById('cycle-badge')
  if (st.cycle) {
    const isVeg = st.cycle.includes('VEG')
    badge.style.display    = 'block'
    badge.textContent      = st.cycle
    badge.style.color      = isVeg ? '#4ade80' : '#c084fc'
    badge.style.background = isVeg ? 'rgba(34,197,94,.1)' : 'rgba(192,132,252,.1)'
    badge.style.border     = `1px solid ${isVeg ? 'rgba(34,197,94,.3)' : 'rgba(192,132,252,.3)'}`
  } else { badge.style.display = 'none' }

  // Panel border — cambia con el color del estado
  const panel = document.getElementById('hud-panel')
  if (panel) {
    panel.style.borderColor = c
    panel.style.boxShadow   = `inset 0 0 12px ${c}0a, 0 0 14px ${c}44`
  }

  document.getElementById('hp-bar').style.cssText = `width:${st.hp}%;background:${c};box-shadow:0 0 6px ${c}88`
  const hpPct = document.getElementById('hp-pct')
  if (hpPct) hpPct.textContent = `${st.hp}%`

  const hd = document.getElementById('hearts-display')
  hd.textContent = '♥'.repeat(st.hearts) + '♡'.repeat(5 - st.hearts)
  hd.style.color = c; hd.style.textShadow = `0 0 8px ${c}88`

  const tv = parseFloat(st.temp), hv = parseFloat(st.hum)
  const vv = parseFloat(st.vpd), sv = st.soil
  document.getElementById('stat-temp').textContent = `${st.temp}°C`
  document.getElementById('stat-temp').style.color = tv>32?'#f97316':tv<17?'#38bdf8':'#4ade80'
  document.getElementById('stat-hum').textContent  = `${st.hum}%`
  document.getElementById('stat-hum').style.color  = hv<35?'#f97316':hv>85?'#c084fc':'#4ade80'
  document.getElementById('stat-vpd').textContent  = `${st.vpd}`
  document.getElementById('stat-vpd').style.color  = vv>1.5||vv<0.4?'#f97316':'#22d3ee'
  document.getElementById('stat-soil').textContent = `${sv}%`
  document.getElementById('stat-soil').style.color = sv<20?'#f97316':sv>85?'#38bdf8':'#22d3ee'

  // Actualizar spell bar — estado de cada equipo
  // on = funcionando normal | off = apagado | warn = requiere atención
  const DEV_ALERTS = {
    healthy:      {lights:'on', ac:'on', humidif:'off', dehumidif:'on',  calef:'off', extract:'on',  intrac:'on',  riego:'off'},
    thriving:     {lights:'on', ac:'on', humidif:'off', dehumidif:'on',  calef:'off', extract:'on',  intrac:'on',  riego:'off'},
    heat_stress:  {lights:'on', ac:'warn',humidif:'off',dehumidif:'off', calef:'off', extract:'warn',intrac:'on',  riego:'off'},
    cold_stress:  {lights:'on', ac:'off',humidif:'off', dehumidif:'off', calef:'warn',extract:'off', intrac:'off', riego:'off'},
    dehydrated:   {lights:'on', ac:'on', humidif:'on',  dehumidif:'off', calef:'off', extract:'on',  intrac:'on',  riego:'warn'},
    humid_stress: {lights:'on', ac:'on', humidif:'off', dehumidif:'warn',calef:'off', extract:'warn',intrac:'on',  riego:'off'},
  }
  const alerts = DEV_ALERTS[stKey] || {}
  document.querySelectorAll('.spell-btn').forEach(btn => {
    const dev    = btn.dataset.dev
    const status = alerts[dev] || 'off'
    // Actualizar clase visual del botón
    btn.classList.remove('is-on', 'is-off', 'is-warn')
    btn.classList.add(status === 'on' ? 'is-on' : status === 'warn' ? 'is-warn' : 'is-off')
    // Actualizar LED dot
    const dot = btn.querySelector('.spell-dot')
    if (dot) dot.className = `spell-dot s-${status}`
  })

  updateXpHud()

  document.querySelectorAll('.sw-btn').forEach(btn => {
    const bc = STATES[btn.dataset.state].color
    const on = btn.dataset.state === stKey
    btn.style.cssText = `color:${on?bc:'rgba(255,255,255,.3)'};border:1px solid ${on?bc:'rgba(255,255,255,.08)'};background:${on?bc+'18':'transparent'}`
  })
}

// ── Build switcher ────────────────────────────────────────────
const sw = document.getElementById('switcher')
Object.entries(STATES).forEach(([key, st]) => {
  const b = document.createElement('button')
  b.className = 'sw-btn'; b.dataset.state = key
  b.textContent = `${st.emoji} ${st.label}`
  b.onclick = () => apply(key)
  sw.appendChild(b)
})

// ── Init ──────────────────────────────────────────────────────
apply('healthy')

// Simular XP cada 30s (preview solamente)
// En producción: calcular XP server-side según uptime real del dispositivo
setInterval(simulateXpTick, 30000)
</script>
</body>
</html>
